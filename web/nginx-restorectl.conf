# restorectl web UI — drop into /etc/nginx/conf.d/ on the backup server.
#
# A COMPLETE server block on its own port, deliberately: conf.d is included
# at http scope, so a bare `location` here is a syntax error that breaks the
# whole nginx config (including unrelated production vhosts). Standing up a
# separate listener also means this can never interfere with an existing site.
#
# Exposes the contents of every backup, so basic auth is on by default:
#   sudo htpasswd -c /etc/nginx/restorectl.htpasswd jason
server {
    listen      8088;
    listen      [::]:8088;
    server_name _;

    access_log  /var/log/nginx/restorectl.access.log;
    error_log   /var/log/nginx/restorectl.error.log;

    location / {
        # Trusted networks get in without a prompt; anything else still has
        # to authenticate. `satisfy any` means "IP allow OR basic auth",
        # rather than requiring both.
        satisfy any;
        allow 127.0.0.1/32;
        allow ::1/128;
        allow 10.1.1.0/24;        # LAN (IPv4)
        allow 192.168.200.0/24;   # Thunderbolt
        allow 192.168.201.0/24;   # Thunderbolt
        # IPv6 matters here: `home` has an AAAA record, so LAN clients reach
        # it over IPv6 with a PUBLIC source address and never present a
        # 10.1.1.x at all -- v4-only rules silently 401 every local machine.
        allow 2601:201:8a80:2975::/64;  # ISP-delegated LAN prefix (can change)
        allow fd00::/8;                 # ULA -- stable, survives redelegation
        deny  all;

        auth_basic           "restorectl";
        auth_basic_user_file /etc/nginx/restorectl.htpasswd;

        proxy_pass         http://127.0.0.1:8723/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Streaming a large file out of restic can take a while.
        proxy_read_timeout 600s;
        proxy_buffering    off;
    }
}
